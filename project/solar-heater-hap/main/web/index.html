<!DOCTYPE html>
<html lang="bg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar controller</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#F2F1F6;--card:#fff;--txt:#000;--sub:#6D6D72;--sep:#C6C6C8;--green:#34C759;--blue:#3F88F2;--red:#FF3B30;--orange:#FF9500;--off:#E9E9EB}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--txt:#fff;--sub:#8E8E93;--sep:#38383A;--off:#39393D}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h1{font-size:28px;margin:6px 4px 2px}
.dev{color:var(--sub);margin:0 4px 14px;font-size:15px}
.lang{display:flex;gap:6px;margin-top:10px}
.lang button{border:2px solid transparent;border-radius:6px;padding:2px;background:none;line-height:0;cursor:pointer}
.lang button.on{border-color:var(--blue)}
.lang svg{width:30px;height:18px;border-radius:2px;display:block}
h2{font-size:13px;font-weight:500;color:var(--sub);text-transform:uppercase;margin:22px 18px 6px;letter-spacing:.3px}
.grp{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;min-height:46px;font-size:17px;position:relative;gap:12px;width:100%;border:0;background:none;color:inherit;font-family:inherit;text-align:left}
.row+.row:before{content:'';position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.row{cursor:pointer}
.v{color:var(--sub);text-align:right;white-space:nowrap}
.v input,.v select{font:inherit;color:var(--blue);background:none;border:0;text-align:right;padding:2px 0;max-width:11em}
.v input{width:4.4em}
.v input:disabled,.v select:disabled{color:var(--sub);opacity:1}
.v input.code{width:6em;letter-spacing:1px;border-bottom:1px solid var(--sep);text-align:center}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:14px;padding:14px 16px}
.tile .l{color:var(--sub);font-size:14px}
.tile .t{font-size:34px;font-weight:600;margin-top:4px}
.tile .s{color:var(--sub);font-size:13px;margin-top:2px;min-height:16px}
.alarm{background:var(--card);border-radius:14px;padding:12px 16px;border-left:5px solid var(--red);margin-bottom:8px}
.alarm.info{border-left-color:var(--orange)}
.alarm b{font-size:17px}.alarm div{color:var(--sub);font-size:14px;margin-top:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--sub)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;color:#fff;background:var(--blue);margin-top:10px;font-family:inherit;cursor:pointer}
.btn.g{background:var(--green)}.btn.o{background:var(--orange)}.btn.r{background:var(--red)}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:10px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--green);position:relative;flex:none;border:0;padding:0;cursor:pointer}
.sw:after{content:'';position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.off{background:var(--off)}.sw.off:after{right:auto;left:2px}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:11px 10px;text-align:left}th{color:var(--sub);font-weight:500;font-size:13px}
td+td,th+th{text-align:center}tr+tr td{border-top:.5px solid var(--sep)}
td+td{white-space:nowrap}
.days td:first-child{white-space:nowrap}
.days th{vertical-align:top}.days .u{display:block;font-size:11px;font-weight:400;color:var(--sub)}   /* the unit under the column name */   /* the date and the star of a partial day: one line */
td input{font:inherit;color:var(--blue);background:none;border:0;text-align:right;width:2.4em;padding:2px 0}
.cur{background:rgba(63,136,242,.12)}
td select,.v select{font:inherit}
.note{color:var(--sub);font-size:13px;margin:6px 18px 0;white-space:pre-line}
.act{color:var(--blue)}.act.red{color:var(--red)}
.calc{color:var(--blue)}
.na{opacity:.38;pointer-events:none}
.chart{padding:10px 8px 6px}.chart svg{display:block;width:100%;height:auto}
.chart text{font-size:9px;fill:var(--sub)}.chart .ax{stroke:var(--sep);stroke-width:.5}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);padding:2px 8px 4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.days td,.days th{padding:8px 4px;font-size:14px}.days td:first-child,.days th:first-child{text-align:left}
.v a{color:var(--blue);text-decoration:none}
.hide{display:none!important}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:.5px solid var(--sep);display:flex;justify-content:center}
.tabs div{flex:1;max-width:92px;text-align:center;font-size:11px;color:var(--sub);padding:8px 0 22px;cursor:pointer}
.tabs div.on{color:var(--blue)}.tabs i{display:block;margin:0 auto 3px;width:30px;height:30px}.tabs svg{width:30px;height:30px}
section{display:none}section.on{display:block}
.warn{background:#FFF4CC;color:#6b5600;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
@media (prefers-color-scheme:dark){.warn{background:#3a3200;color:#ffe680}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(40,40,40,.92);color:#fff;border-radius:10px;padding:10px 16px;font-size:15px;max-width:88%;text-align:center}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--card);border-radius:14px;max-width:320px;width:100%;overflow:hidden;text-align:center}
.box p{margin:0;padding:20px 18px;font-size:16px}
.box div{display:flex;border-top:.5px solid var(--sep)}
.box button{flex:1;border:0;background:none;font:inherit;font-size:17px;color:var(--blue);padding:12px;cursor:pointer}
.box button+button{border-left:.5px solid var(--sep);font-weight:600;color:var(--red)}
.sw-btn{border:0;background:none;font:inherit;color:var(--blue);font-weight:600;cursor:pointer;padding:0}
.sw-btn:disabled{color:var(--sub)}
</style></head><body>
<div class="wrap">
<div class="warn hide" id="offline" data-t="offline"></div>
<div class="top">
 <div><h1 data-t="title"></h1>
 <p class="dev"><span data-f="season"><span id="hd-season">—</span> · </span><span data-f="clock"><span id="hd-time">--:--</span></span></p></div>
 <div class="lang">
  <button id="l-bg" title="Български"><svg viewBox="0 0 5 3"><path fill="#fff" d="M0 0h5v3H0z"/><path fill="#00966E" d="M0 1h5v1H0z"/><path fill="#D62612" d="M0 2h5v1H0z"/></svg></button>
  <button id="l-en" title="English"><svg viewBox="0 0 60 36"><path fill="#012169" d="M0 0h60v36H0z"/><path d="M0 0l60 36M60 0L0 36" stroke="#fff" stroke-width="7"/><path d="M0 0l60 36M60 0L0 36" stroke="#C8102E" stroke-width="3"/><path d="M30 0v36M0 18h60" stroke="#fff" stroke-width="12"/><path d="M30 0v36M0 18h60" stroke="#C8102E" stroke-width="7"/></svg></button>
 </div>
</div>

<section id="s1" class="on">
 <div id="alarms" data-f="alarms"></div>
 <h2 data-t="temps"></h2>
 <div class="big" data-f="temps">
  <div class="tile"><div class="l" data-t="tank"></div><div class="t" id="t-tank">---</div><div class="s" id="s-tank"></div></div>
  <div class="tile"><div class="l" data-t="col"></div><div class="t" id="t-col">---</div><div class="s" id="s-col"></div></div>
 </div>
 <p class="note hide" data-f="mount" id="meas-note"></p>
 <h2 data-t="pump"></h2>
 <div class="grp">
  <div class="row" data-f="pump"><span><span class="dot" id="p-dot"></span><span id="p-txt">—</span></span></div>
  <div class="row" data-f="run_today"><span data-t="today"></span><span class="v" id="run-today">—</span></div>
  <div class="row hide" data-f="night_cool" id="cool-row"><span data-t="night_s"></span><span class="v" id="cool-v" style="white-space:normal">—</span></div>
  <div class="row hide" data-f="heater" id="leak-row"><span data-t="leak"></span><span class="v" id="leak-v" style="white-space:normal">—</span></div>
 </div>
 <h2 data-t="chart" data-f="chart"></h2>
 <div class="grp chart" data-f="chart"><svg id="chart" viewBox="0 0 320 170"></svg>
  <div class="lg"><span><i style="background:var(--red)"></i><span data-t="col"></span></span><span><i style="background:var(--blue)"></i><span data-t="tank"></span></span>
  <span><i style="background:var(--green)"></i><span data-t="k_charge"></span></span><span><i style="background:var(--orange)"></i><span data-t="k_prot"></span></span><span><i style="background:var(--sub)"></i><span data-t="k_other"></span></span></div></div>
 <p class="note" data-f="chart" id="chart-note"></p>
 <h2 data-t="system"></h2>
 <div class="grp">
  <div class="row" data-f="vacation"><span data-t="mode"></span><span class="v" id="mode-v">—</span></div>
  <div class="row" data-f="season"><span data-t="season"></span><span class="v" id="season-v">—</span></div>
  <div class="row" data-f="heater"><span data-t="heater"></span><span class="v" id="heat-v" style="white-space:normal">—</span></div>
  <div class="row" data-f="clock"><span data-t="clock"></span><span class="v" id="clock-v">—</span></div>
 </div>
 <h2 data-t="last7" data-f="history"></h2>
 <div class="grp" style="padding:4px 6px" data-f="history">
  <table class="days"><thead><tr><th data-t="date"></th><th><span data-t="col"></span><span class="u">°C</span></th><th><span data-t="tank"></span><span class="u">°C</span></th><th><span data-t="pump"></span><span class="u">h:min</span></th><th><span data-t="cool_h"></span><span class="u">min</span></th><th data-f="heater"><span data-t="heat_h"></span><span class="u">min</span></th></tr></thead><tbody id="days"></tbody></table>
 </div>
 <p class="note" data-f="history" data-t="days_note"></p>
</section>

<section id="s2">
 <h2 data-t="vac" data-f="vacation"></h2>
 <div class="grp" data-f="vacation"><div class="row"><span data-t="vac_mode"></span><button class="sw off" data-sw="hol" role="switch"></button></div></div>
 <p class="note" data-f="vacation" id="vac-note"></p>
 <h2 data-t="pump"></h2>
 <div data-f="pump_test">
  <div class="grp"><div class="row"><span data-t="test"></span><span class="v" id="test-v">—</span></div></div>
  <button class="btn g" id="b-start" data-t="test_start"></button>
  <div class="btns hide" id="test-ctl">
   <button class="btn" id="b-minus">−60 s</button>
   <button class="btn" id="b-plus">+60 s</button>
   <button class="btn r" id="b-stop" data-t="test_stop"></button>
  </div>
  <p class="note" data-t="test_note"></p>
 </div>
 <h2 data-t="air" data-f="deaerate"></h2>
 <div data-f="deaerate">
  <div class="grp"><div class="row" style="flex-direction:column;align-items:flex-start;gap:4px;font-size:15px"><span id="air-d">—</span><span class="v hide" id="air-v" style="text-align:left;white-space:normal"></span></div></div>
  <button class="btn o" id="b-air" data-t="air_start"></button>
  <button class="btn r hide" id="b-air-stop" data-t="test_stop"></button>
  <p class="note" id="air-note"></p>
 </div>
</section>

<section id="s3">
 <h2 data-t="season" data-f="season"></h2>
 <div class="grp" data-f="season"><label class="row"><span data-t="season"></span><span class="v"><select data-k="ssn"><option value="2" data-t="s_auto"></option><option value="0" data-t="summer"></option><option value="1" data-t="winter"></option></select></span></label></div>
 <h2 data-t="common"></h2>
 <div class="grp">
  <label class="row" data-f="settings"><span data-t="tmax"></span><span class="v"><input type="number" inputmode="numeric" data-k="tbo"> °C</span></label>
  <div class="row" data-f="night_cool"><span data-t="night"></span><button class="sw off" id="sw-nc" role="switch"></button></div>
  <div class="row" data-f="frost"><span data-t="frost"></span><button class="sw off" id="sw-fro" role="switch"></button></div>
  <label class="row" data-f="settings"><span data-t="test_time"></span><span class="v"><input type="number" inputmode="numeric" data-k="t_st"> s</span></label>
 </div>
 <h2 data-t="by_season"></h2>
 <div class="grp" style="padding:4px 6px">
  <table id="season-t"><tr><th data-t="param"></th><th data-t="summer"></th><th data-f="season" data-t="winter"></th></tr>
  <tr data-f="settings"><td data-t="col_min"></td><td><input type="number" inputmode="numeric" data-k="c_lo"> °C</td><td data-f="season"><input type="number" inputmode="numeric" data-k="c_lo_w"> °C</td></tr>
  <tr data-f="settings"><td data-t="d_on"></td><td><input type="number" inputmode="numeric" data-k="d_on"> K</td><td data-f="season"><input type="number" inputmode="numeric" data-k="d_on_w"> K</td></tr>
  <tr data-f="settings"><td data-t="d_off"></td><td><input type="number" inputmode="numeric" data-k="d_of"> K</td><td data-f="season"><input type="number" inputmode="numeric" data-k="d_of_w"> K</td></tr>
  <tr data-f="night_cool"><td data-t="night_s"></td><td><button class="sw-btn" data-sw="nc"></button></td><td><button class="sw-btn" data-sw="nc_w"></button></td></tr></table>
 </div>
 <p class="note" data-f="season" data-t="season_note"></p>
</section>

<section id="s4">
 <div class="lock">
  <div class="grp"><div class="row"><span data-t="code"></span><span class="v"><input class="code" maxlength="6" autocomplete="off" autocapitalize="characters"></span></div></div>
  <button class="btn unlock" data-t="unlock"></button>
  <p class="note" data-t="code_note"></p>
 </div>
 <h2 data-t="fluid"></h2>
 <div class="grp">
  <label class="row" data-f="fluid"><span data-t="kind"></span><span class="v"><select data-p id="i-fluid"><option value="0" data-t="water"></option><option value="1" data-t="glycol"></option></select></span></label>
  <label class="row" data-f="fluid"><span data-t="conc"></span><span class="v"><input type="number" inputmode="numeric" data-p data-k="glycol"> %</span></label>
  <label class="row" data-f="pressure"><span data-t="press"></span><span class="v"><input type="number" inputmode="decimal" data-p data-k="press" data-m="10"> bar</span></label>
 </div>
 <h2 data-t="col_tank"></h2>
 <div class="grp">
  <label class="row" data-f="col_type"><span data-t="col_kind"></span><span class="v"><select data-p data-k="col_type"><option value="0" data-t="flat"></option><option value="1" data-t="tubes"></option></select></span></label>
  <label class="row" data-f="col_type"><span data-t="col_area"></span><span class="v"><input type="number" inputmode="decimal" data-p data-k="col_area" data-m="10"> m²</span></label>
  <label class="row" data-f="col_max"><span data-t="col_max"></span><span class="v"><input type="number" inputmode="numeric" data-p data-k="col_max"> °C</span></label>
  <label class="row" data-f="tank_vol"><span data-t="tank_vol"></span><span class="v"><input type="number" inputmode="numeric" data-p data-k="tank_vol"> l</span></label>
  <label class="row" data-f="heater"><span data-t="heater_kw"></span><span class="v"><input type="number" inputmode="decimal" data-p data-k="heater" data-m="10"> kW</span></label>
  <label class="row" data-f="mount"><span data-t="mount"></span><span class="v"><select data-p data-k="mount"><option value="0" data-t="sleeves"></option><option value="1" data-t="pipes"></option></select></span></label>
 </div>
 <p class="note" data-f="mount" data-t="mount_note"></p>
 <h2 data-t="calc"></h2>
 <div class="grp">
  <div class="row" data-f="calc"><span data-t="boil"></span><span class="v calc" id="c-boil">—</span></div>
  <div class="row" data-f="calc"><span data-t="cap"></span><span class="v calc" id="c-cap">—</span></div>
  <div class="row" data-f="calc"><span data-t="prot"></span><span class="v calc" id="c-prot">—</span></div>
  <div class="row" data-f="calc"><span data-t="no_start"></span><span class="v calc" id="c-ns">—</span></div>
  <div class="row" data-f="vac_limit"><span data-t="vac_limit"></span><span class="v calc" id="c-vac">—</span></div>
  <div class="row" data-f="calc"><span data-t="frost_below"></span><span class="v calc" id="c-frost">—</span></div>
 </div>
 <p class="note hide" id="n-prot"></p>
</section>

<section id="s5">
 <div class="lock">
  <div class="grp"><div class="row"><span data-t="code"></span><span class="v"><input class="code" maxlength="6" autocomplete="off" autocapitalize="characters"></span></div></div>
  <button class="btn unlock" data-t="unlock"></button>
  <p class="note" data-t="code_note"></p>
 </div>
 <h2 data-t="net"></h2>
 <div class="grp">
  <div class="row" data-f="net"><span>Wi-Fi</span><span class="v" id="n-wifi">—</span></div>
  <div class="row" data-f="net"><span data-t="ip"></span><span class="v" id="n-ip">—</span></div>
  <div class="row" data-f="net"><span data-t="hostname"></span><span class="v" id="n-host">—</span></div>
  <div class="row" data-f="net_mode"><span data-t="mode"></span><span class="v" id="n-mode" style="white-space:normal">—</span></div>
 </div>
 <p class="note" data-f="net_mode" data-t="mode_note"></p>
 <h2 data-t="time_place" data-f="timezone"></h2>
 <div class="grp">
  <label class="row" data-f="timezone"><span data-t="tz"></span><span class="v"><select data-p id="tz-sel"></select></span></label>
  <div class="row hide" data-f="timezone" id="tz-sug"><span id="tz-sug-t"></span><button class="sw-btn" data-p id="tz-ok" data-t="confirm"></button></div>
  <div class="row" data-f="timezone"><span data-t="peak"></span><span class="v" id="peak-v">—</span></div>
  <div class="row" data-f="city"><span data-t="city"></span><span class="v">— ›</span></div>
 </div>
 <h2 data-t="learned" data-f="night_cool"></h2>
 <div class="grp" data-f="night_cool">
  <div class="row"><span data-t="l_rise"></span><span class="v" id="l-rise">—</span></div>
  <div class="row"><span data-t="l_set"></span><span class="v" id="l-set">—</span></div>
  <div class="row"><span data-t="l_target"></span><span class="v" id="l-target">—</span></div>
  <div class="row" data-f="heater"><span data-t="l_heater"></span><span class="v" id="l-heater">—</span></div>
  <div class="row" data-f="heater"><span data-t="l_e8"></span><span class="v" id="l-e8">—</span></div>
 </div>
 <p class="note" data-f="night_cool" data-t="learned_note"></p>
 <h2 data-t="fw"></h2>
 <div class="grp">
  <div class="row" data-f="fw"><span data-t="ver"></span><span class="v" id="fw-v">—</span></div>
  <div class="row" data-f="fw"><span data-t="sn"></span><span class="v" id="fw-sn">—</span></div>
  <button class="row" data-f="ota" data-p id="ota-chk"><span data-t="ota" class="act"></span></button>
  <div class="row hide" data-f="ota" id="ota-row"><span id="ota-t" style="white-space:normal"></span><button class="sw-btn hide" data-p id="ota-up" data-t="update"></button></div>
 </div>
 <p class="note hide" data-f="ota" id="ota-note"></p>
 <h2 data-f="homekit">HomeKit</h2>
 <div class="grp" data-f="homekit"><div class="row"><span data-t="paired"></span><span class="v">—</span></div></div>
 <h2 data-t="hist" data-f="history"></h2>
 <div class="grp" data-f="history"><a class="row" href="/api/history.csv" download style="text-decoration:none"><span data-t="hist_dl" class="act"></span></a></div>
 <h2 data-t="reset"></h2>
 <div class="grp">
  <button class="row" data-f="reset" data-p data-r="wifi"><span data-t="rs_wifi" class="act"></span></button>
  <button class="row" data-f="homekit"><span data-t="rs_hk" class="act"></span></button>
  <button class="row" data-f="learned" data-p data-r="learned"><span data-t="rs_learn" class="act"></span></button>
  <button class="row" data-f="history" data-p data-r="history"><span data-t="rs_hist" class="act"></span></button>
  <button class="row" data-f="reset" data-p data-r="defaults"><span data-t="rs_def" class="act"></span></button>
  <button class="row" data-f="reset" data-p data-r="factory"><span data-t="rs_fact" class="act red"></span></button>
 </div>
</section>
</div>

async function post(url,data,quiet){
 const b=new URLSearchParams(data);if(code)b.set('code',code);
 try{const r=await fetch(url,{method:'POST',body:b});
  if(r.status==403){lock(true);quiet||toast(t('bad_code'))}else if(!r.ok)toast(t('bad'));
  return r.ok}
 catch(e){offline(true);return false}
}

let fails=0;
async function refresh(){
 try{const c=new AbortController(),id=setTimeout(()=>c.abort(),4000);
  const r=await fetch('/api/state',{signal:c.signal});clearTimeout(id);
  if(!r.ok)throw 0;
  S=await r.json();leftAt=Date.now();fails=0;offline(false);render()}
 catch(e){
  /* one lost answer is not a lost connection: try again in 1 s, show it after 2 in a row */
  if(++fails>=2)offline(true);
  if(fails===1)setTimeout(refresh,1000);
 }
}

/* The chart: the temperatures at the end of each 10-min interval, below them the pump band (minutes
   of each interval by kind). x in minutes: 0 ... 1440 from midnight, or -1440 ... 0 from now. */
function drawChart(){
 if(!C)return;
 const W=320,L=28,R=6,T=6,Y0=118,BY=137,day=C.day,x0=day?0:-1440,pw=(W-L-R)/1440;
 const X=x=>L+(x-x0)*pw;let lo=1e9,hi=-1e9;
 C.pts.forEach(p=>[p[1],p[2]].forEach(v=>{if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}}));
 if(lo>hi){lo=0;hi=600}lo=Math.floor(lo/100)*100;hi=Math.ceil(hi/100)*100;if(hi-lo<200)hi=lo+200;
 const Y=v=>Y0-(v-lo)/(hi-lo)*(Y0-T),st=(hi-lo)/100>6?200:100;let h='';
 for(let v=lo;v<=hi;v+=st)h+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-3}" y="${Y(v)+3}" text-anchor="end">${v/10}°</text>`;
 for(let i=0;i<=4;i++){const x=x0+i*360;h+=`<text x="${X(x)}" y="${Y0+11}" text-anchor="middle">${day?p2(i*6):(i<4?'−'+(24-i*6)+' h':'0')}</text>`}
 [[1,'var(--red)'],[2,'var(--blue)']].forEach(([k,col])=>{let d='',prev=null;
  C.pts.forEach(p=>{const v=p[k];if(v==null){prev=null;return}d+=(prev?'L':'M')+X(p[0]).toFixed(1)+' '+Y(v).toFixed(1);prev=1});
  if(d)h+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`});
 h+=`<rect x="${L}" y="${BY}" width="${W-L-R}" height="12" rx="2" fill="var(--off)"/>`;
 C.pts.forEach(p=>{let x=X(p[0]-10);[[3,'var(--green)'],[4,'var(--orange)'],[6,'var(--orange)'],[5,'var(--sub)']].forEach(([k,col])=>{
  if(p[k]>0){h+=`<rect x="${x.toFixed(1)}" y="${BY}" width="${(p[k]*pw).toFixed(2)}" height="12" fill="${col}"/>`;x+=p[k]*pw}})});
 $('#chart').setAttribute('viewBox','0 0 320 156');$('#chart').innerHTML=h;
 $('#chart-note').textContent=t(day?'chart_day':'chart_24');
}
function drawDays(){

 const tv=v=>v==null?'—':deg(v);   /* the units are under the column names */
 D.days.forEach(d=>{const r=b.insertRow(),run=d.run[0]+d.run[1]+d.run[2]+d.cool;
  [d.d.slice(8,10)+'.'+d.d.slice(5,7)+(d.part?'*':''),tv(d.cx),(d.tn==null?'—':deg(d.tn))+' – '+tv(d.tx),Math.floor(run/60)+':'+p2(run%60),d.cool||'—',d.heat||'—'].forEach(x=>r.insertCell().textContent=x)});
}
